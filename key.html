<!doctype html>

<title>보장마트 · 영수증 속 회사 이름표</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1c2333;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 44px}
.badge{display:inline-block;background:#eae6da;color:#6b7280;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{font-size:21px;margin:2px 0 6px;letter-spacing:-.2px}
.sub{font-size:14.5px;color:#5b6475;margin:0 0 16px}
.imgbox{position:relative}
img.key{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.09)}
.cap{font-size:12.5px;color:#8a92a2;text-align:center;margin:8px 2px 0}
.note{background:#fff;border-radius:16px;padding:15px 16px;margin:16px 0 6px;font-size:14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.note b{display:block;margin-bottom:5px;font-size:14.5px;color:#1f3a8a}
.note p{margin:0;color:#3b4454}
.cta{display:block;text-decoration:none;background:#1f3a8a;color:#fff;border-radius:14px;padding:15px 16px;margin-top:12px;text-align:center}
.cta b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.cta small{display:block;font-size:12.5px;opacity:.9;margin-top:3px;font-weight:500}
.cta.ghost{background:#fff;color:#1f3a8a;border:1.6px solid #1f3a8a}
.cta.ghost b{font-size:15px}
.fine{font-size:12px;color:#7a8394;margin-top:16px;text-align:center}
</style>
</head>
<body>
